<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Lo reemplaza el valor de --base-href al compilar (ver publicar_web.bat). -->
  <base href="/riftbound-data/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tu colección de Riftbound TCG: cartas, precios de TCGplayer en MXN, decks, trades y lista WTS, sincronizados entre tus dispositivos.">
  <meta name="theme-color" content="#0D0D12">

  <!-- Instalar como app (Android / iPhone) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Riftbound">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Riftbound Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0D0D12; }
    /* Pantalla de carga: se quita cuando Flutter dibuja el primer cuadro. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #ECEAF2; transition: opacity .25s ease;
    }
    #splash img { width: 96px; height: 96px; }
    #splash .name { font-size: 22px; letter-spacing: .2px; }
    #splash .name b { color: #E0A23B; font-weight: 600; }
    #splash .bar {
      width: 140px; height: 3px; border-radius: 2px; background: #2A2A36; overflow: hidden;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #E0A23B;
      animation: load 1.1s ease-in-out infinite;
    }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Riftbound <b>Tracker</b></div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
